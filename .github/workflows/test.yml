name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Windows CI 默认 stdout 是 cp1252，测试脚本含中文/✓ 会抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # 离线测试只需核心依赖；mitmproxy 仅抓包用且要求 Python>=3.12，
        # 这里按 Python 版本过滤掉它，让 3.9/3.11/3.13 都能装、都能跑测试。
        run: |
          python -m pip install --upgrade pip
          python -c "from pathlib import Path; lines=[l for l in Path('requirements.txt').read_text(encoding='utf-8').splitlines(keepends=True) if l.strip() and not l.strip().startswith('mitmproxy')]; Path('requirements.test.txt').write_text(''.join(lines), encoding='utf-8')"
          python -m pip install -r requirements.test.txt

      - name: Run offline tests
        # 所有测试均用临时数据库/目录，不读写真实数据，无需微信或抓包
        run: |
          python test_seed_biz.py
          python test_pipeline.py
          python test_collect.py
          python test_content.py

      - name: Validate Skill metadata
        run: python scripts/validate_skill.py
